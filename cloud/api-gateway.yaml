openapi: "3.0.0"
info:
  title: Assessment Ranking API
  version: "1.1.0"
x-yc-apigateway:
  cors:
    origin:
      - "https://assessment-b1gafbjd3dlh-web.website.yandexcloud.net"
    methods:
      - GET
      - POST
    allowedHeaders:
      - Content-Type
    maxAge: 600
paths:
  /v1/admin:
    get:
      operationId: getAdminHealth
      summary: Read the protected administration runtime health
      responses:
        "200":
          description: Administration runtime health
        "503":
          description: Administration runtime is temporarily unavailable
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4e1qffg3l40q6jgq0t9
        tag: "admin-v5"
        service_account_id: ajerg3btsr8m7va4gi2m
        payload_format_version: "0.1"
    post:
      operationId: submitAdminAction
      summary: Run an authenticated administration action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Application-level administration response
        "503":
          description: Administration runtime is temporarily unavailable
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4e1qffg3l40q6jgq0t9
        tag: "admin-v5"
        service_account_id: ajerg3btsr8m7va4gi2m
        payload_format_version: "0.1"
  /v1/assessment:
    get:
      operationId: getAssessmentHealth
      summary: Read the gated assessment runtime health
      responses:
        "200":
          description: Assessment runtime health
        "503":
          description: Assessment runtime is temporarily unavailable
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4e1qffg3l40q6jgq0t9
        tag: "assessment-v8"
        service_account_id: ajerg3btsr8m7va4gi2m
        payload_format_version: "0.1"
    post:
      operationId: submitAssessmentAction
      summary: Start or save a gated assessment attempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Application-level assessment response
        "503":
          description: Assessment runtime is temporarily unavailable
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4e1qffg3l40q6jgq0t9
        tag: "assessment-v8"
        service_account_id: ajerg3btsr8m7va4gi2m
        payload_format_version: "0.1"
  /v1/ranking:
    get:
      operationId: getPublicRanking
      summary: Read the voluntary public ranking
      parameters:
        - name: testId
          in: query
          required: true
          schema:
            type: string
            enum:
              - fa-junior
              - ca-junior
              - fpa-junior
              - acc-junior
              - bi-junior
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Public ranking or collecting state
        "400":
          description: Unsupported test
        "503":
          description: Ranking is temporarily unavailable
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4e1qffg3l40q6jgq0t9
        tag: "read-v6"
        service_account_id: ajerg3btsr8m7va4gi2m
        payload_format_version: "0.1"
  /v1/ranking/profile:
    post:
      operationId: managePublicRankingProfile
      summary: Publish or withdraw a voluntary public ranking profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Profile publication or withdrawal accepted
        "400":
          description: Invalid request
        "403":
          description: Result proof rejected
        "503":
          description: Ranking is temporarily unavailable
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4e1qffg3l40q6jgq0t9
        tag: "write-v8"
        service_account_id: ajerg3btsr8m7va4gi2m
        payload_format_version: "0.1"
