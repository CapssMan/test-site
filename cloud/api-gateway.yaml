openapi: "3.0.0"
info:
  title: Assessment Ranking API
  version: "1.1.0"
x-yc-apigateway:
  cors:
    origin:
      - "https://assessment-b1gafbjd3dlh-web.website.yandexcloud.net"
    methods:
      - GET
      - POST
    allowedHeaders:
      - Content-Type
      - Authorization
      - Cache-Control
      - Pragma
    maxAge: 600
paths:
  /v1/admin:
    get:
      operationId: getAdminHealth
      summary: Read the protected administration runtime health
      responses:
        "200":
          description: Administration runtime health
        "503":
          description: Administration runtime is temporarily unavailable
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4e1qffg3l40q6jgq0t9
        tag: "admin-v12"
        service_account_id: ajerg3btsr8m7va4gi2m
        payload_format_version: "0.1"
    post:
      operationId: submitAdminAction
      summary: Run an authenticated administration action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Application-level administration response
        "503":
          description: Administration runtime is temporarily unavailable
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4e1qffg3l40q6jgq0t9
        tag: "admin-v12"
        service_account_id: ajerg3btsr8m7va4gi2m
        payload_format_version: "0.1"
  /v1/assessment:
    get:
      operationId: getAssessmentHealth
      summary: Read the gated assessment runtime health
      responses:
        "200":
          description: Assessment runtime health
        "503":
          description: Assessment runtime is temporarily unavailable
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4e1qffg3l40q6jgq0t9
        tag: "assessment-v14"
        service_account_id: ajerg3btsr8m7va4gi2m
        payload_format_version: "0.1"
    post:
      operationId: submitAssessmentAction
      summary: Start or save a gated assessment attempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Application-level assessment response
        "503":
          description: Assessment runtime is temporarily unavailable
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4e1qffg3l40q6jgq0t9
        tag: "assessment-v14"
        service_account_id: ajerg3btsr8m7va4gi2m
        payload_format_version: "0.1"
  /v1/account:
    get:
      operationId: getCandidateAccountConfig
      summary: Read the gated candidate account configuration
      responses:
        "200":
          description: Candidate account configuration
        "503":
          description: Candidate account service is temporarily unavailable
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4e1qffg3l40q6jgq0t9
        tag: "account-v6"
        service_account_id: ajerg3btsr8m7va4gi2m
        payload_format_version: "0.1"
    post:
      operationId: manageCandidateAccount
      summary: Exchange Yandex ID PKCE code and manage the candidate profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Candidate account action accepted
        "401":
          description: Candidate session is missing or expired
        "503":
          description: Candidate account service is temporarily unavailable
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4e1qffg3l40q6jgq0t9
        tag: "account-v6"
        service_account_id: ajerg3btsr8m7va4gi2m
        payload_format_version: "0.1"
  /v1/employer:
    get:
      operationId: getEmployerWorkspaceConfig
      summary: Read the gated employer workspace configuration
      responses:
        "200":
          description: Employer workspace configuration
        "503":
          description: Employer workspace is temporarily unavailable
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4e1qffg3l40q6jgq0t9
        tag: "employer-v4"
        service_account_id: ajerg3btsr8m7va4gi2m
        payload_format_version: "0.1"
    post:
      operationId: manageEmployerWorkspace
      summary: Search consented candidate profiles and manage protected shortlists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Employer workspace action accepted
        "401":
          description: Account session is missing or expired
        "403":
          description: Employer verification or workspace gate is missing
        "503":
          description: Employer workspace is temporarily unavailable
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4e1qffg3l40q6jgq0t9
        tag: "employer-v4"
        service_account_id: ajerg3btsr8m7va4gi2m
        payload_format_version: "0.1"
  /v1/ranking:
    get:
      operationId: getPublicRanking
      summary: Read the voluntary public ranking
      parameters:
        - name: testId
          in: query
          required: true
          schema:
            type: string
            enum:
              - fa-junior
              - ca-junior
              - fpa-junior
              - acc-junior
              - bi-junior
              - tourism-junior
              - software-junior
              - product-project-junior
              - sales-junior
              - logistics-procurement-junior
              - digital-marketing-junior
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Public ranking or collecting state
        "400":
          description: Unsupported test
        "503":
          description: Ranking is temporarily unavailable
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4e1qffg3l40q6jgq0t9
        tag: "read-v7"
        service_account_id: ajerg3btsr8m7va4gi2m
        payload_format_version: "0.1"
  # BEGIN UNIFIED_ORIGIN_PREVIEW
  /preview-unified:
    get:
      operationId: getUnifiedPreviewIndex
      summary: Serve the isolated unified-origin preview index
      responses:
        "200":
          description: Unified-origin preview index
      x-yc-apigateway-integration:
        type: object_storage
        bucket: assessment-b1gafbjd3dlh-web
        object: index.html
  /preview-unified/{file+}:
    get:
      operationId: getUnifiedPreviewFile
      summary: Serve an isolated unified-origin preview file
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Unified-origin preview file
        "404":
          description: Unified-origin preview file not found
      x-yc-apigateway-integration:
        type: object_storage
        bucket: assessment-b1gafbjd3dlh-web
        object: '{file}'
  # END UNIFIED_ORIGIN_PREVIEW
  /v1/ranking/profile:
    post:
      operationId: managePublicRankingProfile
      summary: Publish or withdraw a voluntary public ranking profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Profile publication or withdrawal accepted
        "400":
          description: Invalid request
        "403":
          description: Result proof rejected
        "503":
          description: Ranking is temporarily unavailable
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4e1qffg3l40q6jgq0t9
        tag: "write-v9"
        service_account_id: ajerg3btsr8m7va4gi2m
        payload_format_version: "0.1"
